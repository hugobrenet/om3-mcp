# OPENSVC_MCP_CLUSTER_CONFIG_FILE=/etc/opensvc-mcp/clusters.yaml
# Values are fictional. Keep actual deployment configuration outside Git.
clusters:
  cluster-a:
    name: cluster-a
    cluster_id: 00000000-0000-4000-8000-000000000001
    endpoint: https://cluster-a-vip.example.com:1215
    # Optional: token exchange for external agents on HTTPS. Without auth,
    # the cluster is reachable only through the delegated Unix socket.
    auth:
      profile: customer-sso
      audience: opensvc-cluster-a
    request_timeout: 20s
    # Omit tls for system roots. For a private CA:
    # tls:
    #   ca_file: /etc/opensvc-mcp/ca/customer.pem
    # Alternatively tls.insecure: true, mutually exclusive with ca_file.
